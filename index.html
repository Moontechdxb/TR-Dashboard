<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MoonTech × ITCAN People Guide</title>
<meta name="description" content="MoonTech's self-service People Guide: policies, leave entitlements, working arrangements and where to go for support. Based on the MoonTech Employee Handbook, Final, 27 July 2026.">
<meta name="color-scheme" content="light">
<meta property="og:title" content="MoonTech × ITCAN People Guide">

<style>
/* ==========================================
   MOONTECH PEOPLE HANDBOOK — STYLES
   Design tokens below. Colors/spacing follow the MoonTech brand system;
   content structure follows the source handbook PDF (27 July 2026).
   ========================================== */
:root{
  --navy:#020A33;
  --purple:#3E278D;
  --purple-dark:#2B1B66;
  --soft-purple:#F3EFFC;
  --mauve:#AD5C9A;
  --orange:#FF9500;
  --bg:#F9F8FC;
  --card:#FFFFFF;
  --lavender:#F3EFFC;
  --lavender-deep:#E9E4F8;
  --border:#E9E4F8;
  --text:#1C1B2E;
  --text-dim:#615C78;
  --peach:#FDECD8;
  --peach-border:#F6D4AC;
  --green:#1E8E5A;
  --amber:#B8860B;
  --red:#C0362C;
  --radius-sm:8px;
  --radius:14px;
  --radius-lg:20px;
  --shadow-sm:0 1px 2px rgba(2,10,51,.06);
  --shadow-md:0 10px 26px rgba(2,10,51,.09);
  --shadow-lg:0 20px 48px rgba(2,10,51,.16);
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --header-h:64px;
  --sidebar-w:184px;
  --maxw:1300px;
  --shell-pad:32px;
  --gutter:30px;
  --transition:160ms ease;
  --view-motion:160ms ease;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden;max-width:100%}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased;line-height:1.55;font-size:16px;
  overflow-x:hidden;
}
img,svg{max-width:100%}
/* Safety-net default for every icon()-generated inline SVG (all carry
   aria-hidden="true" — see icon() in js.py). Without an explicit width/height,
   an <svg> with only a viewBox falls back to the browser's replaced-element
   default box, which can stretch to fill a flex/inline-flex parent — that is
   what produced the oversized map-pin icon in the compact "About you"
   summary. Every specific `.foo svg{width:...}` / `.foo{width:...}` rule
   below has higher specificity and wins over this default, so this exists
   purely as a fallback so a future icon() usage can never regress this way. */
svg[aria-hidden="true"]{width:16px;height:16px;flex-shrink:0}
a{color:var(--purple)}
a:not(.btn):not(.card-link){text-underline-offset:2px}
h1,h2,h3,h4{font-family:var(--font-sans);font-weight:800;line-height:1.12;margin:0;color:var(--navy);letter-spacing:-.01em}
p{margin:0}
ul{margin:0;padding:0}
li{list-style:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:1rem}

/* focus states */
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--orange);outline-offset:2px;border-radius:4px;
}
/* Headings receive focus programmatically on view navigation (so screen
   reader / keyboard users get the new view announced) — a softer, more
   generous ring than the default so it reads as an intentional wayfinding
   cue rather than a form-validation error box. */
h1:focus-visible,h2:focus-visible{outline:2px solid var(--orange);outline-offset:8px;border-radius:8px}

/* skip link */
.skip-link{
  position:absolute;left:12px;top:-60px;background:var(--navy);color:#fff;padding:10px 16px;
  border-radius:8px;z-index:1000;transition:top var(--transition);font-weight:700;text-decoration:none;
}
.skip-link:focus{top:12px}

/* ---------- Page-width primitives ----------
   Three layout roles, not one global cap. APPLICATION SHELL (.app-shell) uses
   the viewport. PAGE CANVAS (.content) now flexes to fill whatever the shell
   leaves it — no fixed max-width — so a wide monitor doesn't sit inside a
   permanently-1040px column. READING COLUMN (.wrap and its modifiers) is
   what actually controls line length, chosen per page by what the employee
   is doing there: .wrap (unmodified) is the standard tool/default width,
   .wrap-reading narrows further for long-form prose, .wrap-wide opens up for
   interactive tools, tables and the home hero/action grid. */
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:0 clamp(16px,2.2vw,32px);box-sizing:border-box}
.wrap-reading{max-width:800px}
.wrap-wide{max-width:1360px}

/* ---------- Top bar (logo + global search + My Policy only) ---------- */
.topbar{
  position:sticky;top:0;z-index:200;background:var(--navy);color:#fff;height:var(--header-h);
  display:flex;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);
}
/* Full-width application header — the logo aligns with the left rail
   (app-shell's --shell-pad), not with a centred 1300px block. */
.topbar-inner{width:100%;margin:0;padding:0 var(--shell-pad);display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;flex-shrink:0}
.brand svg{width:118px;height:auto;color:#fff}
.topbar-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
.icon-btn{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;width:38px;height:38px;
  border-radius:10px;display:flex;align-items:center;justify-content:center;transition:background var(--transition);
}
.icon-btn:hover{background:rgba(255,255,255,.18)}
.icon-btn svg{width:18px;height:18px}
.btn-pill{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;padding:8px 14px;
  border-radius:999px;font-size:.86rem;font-weight:700;display:none;align-items:center;gap:6px;white-space:nowrap;
  text-decoration:none;
}
.btn-pill:hover{background:rgba(255,255,255,.2)}
.menu-toggle{display:flex}
@media (min-width:1200px){
  .btn-pill{display:inline-flex}
  .menu-toggle{display:none}
}

/* ---------- Search (shared look for header + hero instances) ---------- */
.search-shell{position:relative}
.search-box{
  display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);
  border-radius:10px;padding:0 10px;height:38px;width:100%;max-width:230px;
}
.search-box input{
  background:transparent;border:0;color:#fff;outline:none;width:100%;font-size:.88rem;
}
.search-box input::placeholder{color:rgba(255,255,255,.55)}
.search-box svg{width:16px;height:16px;color:rgba(255,255,255,.6);flex-shrink:0}
.search-kbd{
  border:1px solid rgba(255,255,255,.25);border-radius:5px;padding:1px 6px;font-size:.72rem;color:rgba(255,255,255,.55);
  flex-shrink:0;
}
.search-clear{
  background:none;border:0;color:rgba(255,255,255,.65);width:20px;height:20px;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;border-radius:50%;
}
.search-clear svg{width:13px;height:13px}
.search-clear:hover{background:rgba(255,255,255,.18);color:#fff}
.search-results{
  position:absolute;top:calc(100% + 8px);right:0;width:min(420px,92vw);max-height:70vh;overflow:auto;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);
  padding:8px;display:none;z-index:300;
}
.search-results.open{display:block;animation:searchFade 160ms ease}
@keyframes searchFade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.search-result{
  display:block;padding:12px 12px;border-radius:10px;text-decoration:none;color:var(--text);
}
.search-result:hover,.search-result[aria-selected="true"]{background:var(--lavender)}
.search-result .sr-section{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mauve);font-weight:700}
.search-result .sr-title{font-weight:700;color:var(--navy);margin-top:2px}
.search-result .sr-excerpt{font-size:.85rem;color:var(--text-dim);margin-top:3px;line-height:1.4}
.search-empty{padding:24px 14px;text-align:center;color:var(--text-dim);font-size:.92rem}
.search-flash{animation:flashbg 2.2s ease}
@keyframes flashbg{0%{background:#FCE39A}100%{background:transparent}}

/* Hero (dark) search instance — light surface, elevated, focal point */
.hero-search-shell{position:relative;width:100%;max-width:640px;margin-top:30px}
.hero-search-box{
  display:flex;align-items:center;gap:12px;width:100%;height:60px;background:rgba(255,255,255,.98);
  border:1px solid rgba(255,255,255,.5);border-radius:17px;padding:0 20px;box-shadow:var(--shadow-lg);
}
.hero-search-box svg{width:20px;height:20px;color:var(--purple);flex-shrink:0}
.hero-search-box input{
  flex:1;background:transparent;border:0;outline:none;color:var(--navy);font-size:1.02rem;font-weight:600;
  min-width:0;height:100%;
}
.hero-search-box input::placeholder{color:var(--text-dim);font-weight:500}
.hero-search-box .search-clear{color:var(--text-dim)}
.hero-search-box .search-clear:hover{background:var(--lavender);color:var(--purple)}
.hero-search-box .search-kbd{border-color:var(--border);color:var(--text-dim)}
.hero-search-shell .search-results{left:0;right:0;width:auto;top:calc(100% + 10px)}
@media (max-width:480px){
  .hero-search-box{height:54px;padding:0 14px;border-radius:14px}
  .hero-search-shell .search-kbd{display:none}
}

/* ---------- Layout: left-anchored navigation rail + content ----------
   Deliberately NOT a centred 1300px block: on a wide desktop, centring the
   whole shell put a large empty margin in front of the sidebar, which read
   as an oversized left panel even at a modest sidebar width. The rail sits
   close to the browser edge (--shell-pad); .content itself is now
   unconstrained (see the page-width primitives above .wrap/.wrap-reading/
   .wrap-wide) so a wide monitor doesn't sit inside a fixed-width column —
   each page's inner .wrap chooses how much of that canvas it actually uses. */
.app-shell{display:flex;width:100%;margin:0;padding:0 var(--shell-pad);gap:var(--gutter);box-sizing:border-box}
.sidebar{
  display:none;width:var(--sidebar-w);flex-shrink:0;padding:26px 0 60px;position:sticky;top:var(--header-h);
  align-self:flex-start;height:calc(100vh - var(--header-h));overflow-y:auto;
}
.side-group{margin-bottom:20px}
.side-label{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);font-weight:700;padding:0 10px 7px;opacity:.75}
.side-link{
  display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--text);text-decoration:none;
  font-size:.85rem;font-weight:600;margin-bottom:1px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.side-link svg{width:15px;height:15px;flex-shrink:0;color:var(--text-dim)}
.side-link:hover{background:var(--lavender)}
.side-link[aria-current="true"]{background:var(--lavender);color:var(--purple)}
.side-link[aria-current="true"] svg{color:var(--purple)}
.side-link[aria-current="true"]::before{
  content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;background:var(--purple);border-radius:0 3px 3px 0;
}
.side-link-top{font-weight:700;font-size:.87rem}
.side-link-secondary{color:var(--text-dim);font-size:.82rem;font-weight:600;margin-bottom:12px}
.side-link-secondary svg{width:14px;height:14px}
@media (min-width:1200px){ .sidebar{display:block} }

.content{flex:1;min-width:0;width:100%;max-width:none;padding-bottom:80px}

/* ---------- View router: one primary view visible at a time ---------- */
.view{display:none}
.view.active{display:block;animation:viewFade var(--view-motion)}
@keyframes viewFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ---------- Breadcrumb ---------- */
.view-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px clamp(16px,2.2vw,32px) 0}
.breadcrumb{display:flex;align-items:center;gap:7px;font-size:.82rem;color:var(--text-dim);flex-wrap:wrap}
.breadcrumb a{color:var(--text-dim);text-decoration:none;font-weight:600}
.breadcrumb a:hover{color:var(--purple)}
.breadcrumb .crumb-sep{color:var(--border)}
.breadcrumb .crumb{font-weight:600}
.breadcrumb .crumb.current{color:var(--navy);font-weight:700}
.view-toolbar .copy-link-btn{margin:0}

/* ---------- Mobile drawer ---------- */
.drawer-overlay{position:fixed;inset:0;background:rgba(2,10,51,.5);z-index:400;display:none}
.drawer-overlay.open{display:block}
.drawer{
  position:fixed;top:0;left:0;bottom:0;width:min(84vw,340px);background:var(--card);z-index:401;
  transform:translateX(-100%);transition:transform var(--transition);overflow-y:auto;padding:18px;
  box-shadow:var(--shadow-lg);
}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.drawer-head svg.logo-mark{width:110px;height:auto;color:var(--purple)}
.drawer .side-link{color:var(--text)}
@media (min-width:1200px){ .drawer,.drawer-overlay{display:none !important} }

/* ---------- Hero (dark, premium) ---------- */
.hero{
  position:relative;overflow:hidden;contain:layout paint;padding:76px 0 52px;
  background:linear-gradient(135deg,#020A33 0%,#171044 45%,#3E278D 100%);
}
.hero-glow{position:absolute;border-radius:50%;filter:blur(70px);z-index:0;pointer-events:none}
.hero-glow.g1{width:460px;height:460px;background:radial-gradient(circle,rgba(173,92,154,.26) 0%,rgba(173,92,154,0) 70%);top:-220px;right:-140px}
.hero-glow.g2{width:380px;height:380px;background:radial-gradient(circle,rgba(62,39,141,.42) 0%,rgba(62,39,141,0) 70%);bottom:-200px;left:-120px}
.hero-grid{
  position:absolute;inset:0;z-index:0;opacity:.035;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(ellipse 80% 60% at 70% 20%,#000 0%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse 80% 60% at 70% 20%,#000 0%,transparent 75%);
}
.hero-star{position:absolute;z-index:0;opacity:.1;color:#fff;pointer-events:none}
.hero-star.s1{width:26px;height:26px;top:56px;right:14%}
.hero-star.s2{width:16px;height:16px;top:130px;right:22%}
.hero .wrap{position:relative;z-index:1}
.eyebrow-badge{
  display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);
  color:rgba(255,255,255,.92);font-weight:700;font-size:.76rem;padding:6px 13px;border-radius:999px;margin-bottom:22px;
  letter-spacing:.01em;
}
.eyebrow-badge svg{width:13px;height:13px;flex-shrink:0;color:var(--orange)}
.hero h1{font-size:clamp(2.1rem,5vw,3.4rem);max-width:17ch;color:#fff;letter-spacing:-.02em}
.hero .lede{font-size:1.14rem;color:rgba(233,228,255,.82);max-width:54ch;margin-top:16px;line-height:1.5}
.hero-meta{margin-top:14px;font-size:.82rem;color:rgba(233,228,255,.55)}

/* ---------- Home action cards ---------- */
.home-actions-section{padding-top:56px}
/* Explicit column counts, not auto-fit: with 4 cards, auto-fit's
   minmax(260px,1fr) could pack 3 across at mid-widths and strand the 4th
   card alone on its own row. Fixed breakpoints guarantee a clean 1 / 2x2 / 4
   layout at every width instead. */
.home-action-grid{display:grid;gap:16px;grid-template-columns:repeat(2,1fr)}
@media (max-width:640px){ .home-action-grid{grid-template-columns:1fr} }
@media (min-width:1500px){ .home-action-grid{grid-template-columns:repeat(4,1fr)} }
.home-action{
  text-decoration:none;display:flex;gap:16px;align-items:flex-start;border-radius:18px;border:1px solid var(--border);
  padding:22px;transition:box-shadow var(--transition),transform var(--transition),border-color var(--transition);
}
.home-action:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--lavender-deep)}
.home-action-icon{
  width:44px;height:44px;border-radius:12px;background:var(--lavender);display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.home-action-icon svg{width:21px;height:21px;color:var(--purple)}
.home-action.featured{background:var(--navy);border-color:var(--navy)}
.home-action.featured .home-action-icon{background:rgba(255,255,255,.14)}
.home-action.featured .home-action-icon svg{color:#fff}
.home-action.featured h3{color:#fff}
.home-action.featured p{color:rgba(255,255,255,.72)}
.home-action.featured .home-action-arrow{color:#fff}
.home-action-body{min-width:0}
.home-action-body h3{color:var(--navy);font-size:1.05rem;display:flex;align-items:center;gap:8px;margin-bottom:5px}
.home-action-arrow{width:15px;height:15px;color:var(--purple);flex-shrink:0;transition:transform var(--transition)}
.home-action:hover .home-action-arrow{transform:translateX(3px)}
.home-action-body p{color:var(--text-dim);font-size:.9rem;line-height:1.5}
.browse-row{margin-top:26px}
.browse-link{
  display:inline-flex;align-items:center;gap:8px;color:var(--purple);font-weight:700;font-size:.9rem;text-decoration:none;
  padding:9px 4px;
}
.browse-link svg{width:16px;height:16px}
.browse-link:hover{text-decoration:underline}

/* ---------- Directory ---------- */
.dir-group{margin-bottom:8px}
.dir-group-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);font-weight:700;padding:18px 0 8px;border-top:1px solid var(--border)}
.dir-group:first-child .dir-group-label{border-top:0}
.dir-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 4px;text-decoration:none;
  color:var(--text);font-weight:600;font-size:.95rem;border-bottom:1px solid var(--border);
}
.dir-row:last-child{border-bottom:0}
.dir-row svg{width:15px;height:15px;color:var(--text-dim);flex-shrink:0;transition:transform var(--transition)}
.dir-row:hover{color:var(--purple)}
.dir-row:hover svg{transform:translateX(3px);color:var(--purple)}

/* ---------- Section shell (light canvas after Home) ---------- */
.section{padding:clamp(32px,4vw,56px) 0;border-bottom:1px solid var(--border);scroll-margin-top:calc(var(--header-h) + 12px)}
.section-head{margin-bottom:26px}
.eyebrow{
  display:flex;align-items:center;gap:8px;text-transform:uppercase;font-size:.76rem;letter-spacing:.08em;
  color:var(--mauve);font-weight:800;margin-bottom:10px;
}
.eyebrow::before{content:"";width:9px;height:9px;background:var(--mauve);border-radius:2px;flex-shrink:0}
.section h2{font-size:clamp(1.5rem,3vw,2.15rem)}
.section .lede{color:var(--text-dim);margin-top:10px;font-size:1.02rem;max-width:64ch}
.applies-to{
  display:inline-block;background:var(--soft-purple);color:var(--purple);font-weight:700;font-size:.82rem;
  padding:7px 14px;border-radius:9px;margin-bottom:16px;
}

/* ---------- Cards / grids ---------- */
.grid{display:grid;gap:14px}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:clamp(14px,1.5vw,22px)}
.card-soft{background:var(--lavender);border:1px solid var(--lavender-deep);border-radius:var(--radius);padding:clamp(14px,1.5vw,22px)}
.card h3,.card-soft h3{font-size:1.02rem;margin-bottom:6px;color:var(--navy)}
.card p,.card-soft p{color:var(--text-dim);font-size:.93rem}
.card-list{margin-top:6px}
.card-list li{position:relative;padding-left:16px;margin-bottom:6px;font-size:.93rem;color:var(--text-dim)}
.card-list li::before{content:"";position:absolute;left:0;top:.55em;width:5px;height:5px;background:var(--purple);border-radius:50%}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.stat{background:var(--lavender);border-radius:var(--radius);padding:18px 10px;text-align:center}
.stat b{display:block;font-size:1.9rem;color:var(--purple);font-weight:800}
.stat span{font-size:.78rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em}
.timeline-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;margin:8px 0 24px;position:relative}
.tl-year{font-weight:800;color:var(--purple);font-size:1.15rem;margin-bottom:4px}
.tl-text{color:var(--text-dim);font-size:.92rem}
.belief-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.belief-head{background:var(--purple);color:#fff;padding:14px 16px;font-weight:800;letter-spacing:.01em}
.belief-body{padding:16px}
.belief-tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--mauve);font-weight:800;margin-bottom:6px}

/* ---------- MoonTech principles — numbered rows with a deliberately
   unmistakable hierarchy: the principle NAME reads first and boldest,
   "What this means" / "In practice" are small uppercase labels ahead of
   their own body copy, never competing with the title for attention. ---------- */
.principles-list{border-top:1px solid var(--border)}
.principle-row{display:flex;gap:18px;padding:22px 0;border-bottom:1px solid var(--border)}
.principle-num{
  flex-shrink:0;width:38px;font-size:1.3rem;font-weight:800;color:var(--lavender-deep);font-family:var(--font-sans);
  line-height:1.2;
}
.principle-body{min-width:0;flex:1}
.principle-title{
  font-size:1.15rem;font-weight:800;letter-spacing:-.01em;color:var(--navy);text-transform:uppercase;
  margin-bottom:12px;
}
.principle-block{margin-bottom:10px}
.principle-block:last-child{margin-bottom:0}
.principle-label{
  display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--mauve);font-weight:800;
  margin-bottom:3px;
}
.principle-block p{color:var(--text);font-size:.94rem;line-height:1.5}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:10px;font-weight:700;
  font-size:.92rem;text-decoration:none;border:1px solid transparent;transition:transform var(--transition),box-shadow var(--transition),background var(--transition);
}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--purple);color:#fff}
.btn-primary:hover{background:var(--purple-dark);box-shadow:var(--shadow-md)}
.btn-outline{background:transparent;border-color:var(--border);color:var(--navy)}
.btn-outline:hover{border-color:var(--purple);color:var(--purple)}
.btn-ghost{background:var(--lavender);color:var(--purple)}
.btn-ghost:hover{background:var(--lavender-deep)}
.btn-sm{padding:7px 12px;font-size:.82rem;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed;pointer-events:none}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

/* ---------- Tabs (simple toggle-button groups, not full ARIA tabs) ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:6px;background:var(--lavender);padding:6px;border-radius:12px;margin-bottom:20px}
.tab{
  background:transparent;border:0;padding:9px 15px;border-radius:9px;font-weight:700;font-size:.86rem;color:var(--text-dim);
  transition:background var(--transition),color var(--transition),box-shadow var(--transition);
}
.tab[aria-pressed="true"]{background:var(--card);color:var(--purple);box-shadow:var(--shadow-sm)}

/* ---------- Accordion ---------- */
.accordion-item{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;background:var(--card)}
.accordion-trigger{
  width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;background:none;border:0;
  padding:15px 17px;text-align:left;font-weight:700;color:var(--navy);font-size:.96rem;
}
.accordion-trigger .chev{width:16px;height:16px;color:var(--purple);transition:transform var(--transition);flex-shrink:0}
.accordion-trigger[aria-expanded="true"] .chev{transform:rotate(180deg)}
.accordion-panel{max-height:0;overflow:hidden;transition:max-height var(--transition)}
.accordion-panel-inner{padding:0 17px 16px;color:var(--text-dim);font-size:.92rem;line-height:1.6}
.faq-q{display:flex;gap:8px;align-items:flex-start}
.faq-q .qmark{color:var(--purple);font-weight:800;flex-shrink:0}

/* ---------- Policy / info cards ---------- */
.policy-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow-sm)}
.policy-row{display:grid;grid-template-columns:160px 1fr;gap:4px 16px;padding:10px 0;border-top:1px solid var(--border)}
.policy-row:first-child{border-top:0}
.policy-row dt{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mauve);font-weight:800;padding-top:2px}
.policy-row dd{margin:0;color:var(--text);font-size:.93rem}
.dest-link{font-weight:700;text-decoration:none}
.dest-link:hover{text-decoration:underline}
@media (max-width:640px){.policy-row{grid-template-columns:1fr}}

/* ---------- Info box (dark) ---------- */
.info-box{background:var(--purple);color:#fff;border-radius:var(--radius-lg);padding:22px 24px;margin:18px 0}
.info-box h4{color:#fff;font-size:.98rem;margin-bottom:10px}
.info-box li{position:relative;padding-left:16px;margin-bottom:8px;font-size:.92rem;color:rgba(255,255,255,.92);line-height:1.5}
.info-box li::before{content:"";position:absolute;left:0;top:.6em;width:5px;height:5px;background:#fff;border-radius:50%}

/* highlight (peach) box */
.highlight-box{background:var(--peach);border:1px solid var(--peach-border);border-radius:var(--radius);padding:14px 16px;margin-top:10px;font-weight:700;font-size:.88rem;color:#7A4A15}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--card)}
table.htable{width:100%;border-collapse:collapse;min-width:560px}
table.htable th{background:var(--purple);color:#fff;text-align:left;padding:12px 14px;font-size:.76rem;text-transform:uppercase;letter-spacing:.04em}
table.htable td{padding:12px 14px;border-top:1px solid var(--border);font-size:.89rem;vertical-align:top}
table.htable tr:nth-child(even) td{background:var(--lavender)}
.table-cards{display:none;flex-direction:column;gap:10px}
@media (max-width:640px){
  .table-wrap.responsive-collapse{display:none}
  .table-cards{display:flex}
}

/* ---------- Disciplinary timeline ---------- */
.dtl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin:20px 0}
.dtl-step{position:relative}
.dtl-num{
  width:34px;height:34px;background:var(--purple);color:#fff;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-weight:800;margin-bottom:10px;
}
.dtl-occ{font-weight:800;color:var(--navy);margin-bottom:2px}
.dtl-text{font-size:.9rem;color:var(--text-dim)}

/* ---------- Hybrid work pattern rows (replaces percentage bars — those
   percentages weren't sourced from the handbook itself) ---------- */
.pattern-rows{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card);margin-bottom:16px}
.pattern-row{display:flex;gap:18px;padding:15px 18px;border-top:1px solid var(--border);align-items:baseline;flex-wrap:wrap}
.pattern-row:first-child{border-top:0}
.pattern-row-loc{font-weight:800;color:var(--navy);width:110px;flex-shrink:0;font-size:.94rem}
.pattern-row-text{color:var(--text-dim);font-size:.92rem;flex:1;min-width:200px}

/* ---------- Context bar (persistent location / worker-type) ----------
   Two states: expanded (both selectors visible, shown until both a location
   and a worker type are chosen) and a compact one-line summary once both
   are set, with a "Change" action that re-reveals the selectors. In-memory
   only — nothing here is ever written to storage. */
/* A utility control, not a poster — white surface with a subtle border so it
   never competes with the page's actual content for attention. */
.context-bar{
  display:flex;flex-wrap:wrap;align-items:end;gap:14px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:13px 16px;margin-bottom:20px;
}
.context-bar-label{
  display:flex;align-items:center;gap:6px;font-weight:700;font-size:.78rem;color:var(--text-dim);
  text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;flex-basis:100%;
}
@media (min-width:560px){ .context-bar-label{flex-basis:auto;margin-right:4px} }
.context-bar-label svg{width:14px;height:14px;color:var(--purple)}
.context-field{display:flex;flex-direction:column;gap:3px;font-size:.78rem;font-weight:700;color:var(--text-dim)}
.context-help{font-size:.7rem;font-weight:500;color:var(--text-dim);opacity:.8;margin-top:-1px}
.context-field select{
  background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:9px 10px;font-size:.88rem;
  font-weight:700;color:var(--navy);min-width:170px;
}
.context-field select:disabled{opacity:.5}
.context-bar .btn{align-self:flex-end}
.context-summary{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:10px 16px;margin-bottom:20px;font-size:.86rem;
}
.context-summary-text{color:var(--text-dim);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.context-summary-text svg{width:14px;height:14px;flex:0 0 14px;color:var(--purple)}
.context-summary-text b{color:var(--navy);font-weight:700}
.context-change-btn{
  background:none;border:0;color:var(--purple);font-weight:700;font-size:.85rem;padding:2px 4px;text-decoration:underline;
  text-underline-offset:2px;margin-left:auto;
}

/* location matched to the current context — only ever set for location-based
   employees (see highlightContextLocation()); never implies eligibility for
   Full-Time Remote, freelancers or other worker categories. */
[data-loc].ctx-match{box-shadow:0 0 0 2px var(--purple) inset;border-radius:var(--radius)}
.pattern-row.ctx-match{background:var(--soft-purple)}
.pattern-row.ctx-match .pattern-row-loc{color:var(--purple)}

/* caution note (e.g. Bangalore non-compete) */
.caution-note{margin-top:8px;font-size:.78rem;color:var(--amber);font-style:italic}

/* ---------- Wizard (Policy Finder) ---------- */
.wizard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-sm)}
.option-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.option-btn{
  background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:14px;text-align:left;
  font-weight:700;color:var(--text);font-size:.9rem;transition:border-color var(--transition),background var(--transition);
}
.option-btn:hover{border-color:var(--mauve)}
.option-btn.selected{border-color:var(--purple);background:var(--soft-purple);color:var(--purple)}
.option-btn .opt-sub{display:block;font-weight:500;color:var(--text-dim);font-size:.78rem;margin-top:3px}

/* ---------- Support: secondary resource cards ---------- */
.res-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;
  gap:12px;align-items:flex-start;text-decoration:none;color:var(--text);transition:box-shadow var(--transition),border-color var(--transition);
}
.res-card:hover{box-shadow:var(--shadow-sm);border-color:var(--lavender-deep)}
.res-card-sm h4{font-size:.92rem;color:var(--navy);margin-bottom:3px}
.res-card-sm p{color:var(--text-dim);font-size:.83rem}
.res-icon{width:38px;height:38px;border-radius:10px;background:var(--lavender);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.res-icon svg{width:19px;height:19px;color:var(--purple)}

/* ---------- Feedback link (single instance, bottom of Support only) ---------- */
.feedback-line{margin-top:30px;padding-top:18px;border-top:1px solid var(--border);color:var(--text-dim);font-size:.88rem}
.feedback-line a{font-weight:700}

/* ---------- Belief cards (Our Story) ---------- */
.belief-plain{color:var(--text);font-weight:600;font-size:.92rem;line-height:1.5}

/* ---------- Entity relationship diagram (MoonTech & ITCAN) ---------- */
.entity-diagram{
  display:flex;align-items:center;justify-content:center;gap:18px;padding:26px 16px;background:var(--lavender);
  border-radius:var(--radius-lg);flex-wrap:wrap;
}
.entity-node{
  background:var(--card);border:2px solid var(--purple);color:var(--purple);font-weight:800;font-size:1.02rem;
  padding:14px 26px;border-radius:999px;box-shadow:var(--shadow-sm);
}
.entity-link{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text-dim)}
.entity-link::before{content:"";width:46px;height:2px;background:var(--lavender-deep);display:block}
.entity-link span{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-top:4px}
@media (max-width:480px){
  .entity-diagram{flex-direction:column}
  .entity-link{flex-direction:row}
  .entity-link::before{width:2px;height:26px}
}

/* ---------- Resignation journey (Leaving MoonTech) ---------- */
.journey-list{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);overflow:hidden}
.journey-step{display:flex;gap:14px;padding:16px 18px;border-top:1px solid var(--border);align-items:flex-start}
.journey-step:first-child{border-top:0}

/* ---------- Support: service catalogue ----------
   Explicit columns (large 3 / medium 2 / phone 1) rather than auto-fit, for
   the same reason as the home action grid — predictable rows instead of a
   width-dependent card count that can strand one card alone. */
.catalog-grid{display:grid;gap:14px;align-items:stretch;grid-template-columns:repeat(2,1fr)}
@media (max-width:640px){ .catalog-grid{grid-template-columns:1fr} }
@media (min-width:1000px){ .catalog-grid{grid-template-columns:repeat(3,1fr)} }
/* Leaving MoonTech "At a glance" location cards (Cairo/Dubai/Bangalore/Dammam). Explicit
   breakpoints, not the legacy .grid-N auto-fit classes, so it never lands on a 3+1 orphan row. */
.glance-grid{display:grid;gap:14px;align-items:stretch;grid-template-columns:repeat(2,1fr)}
@media (max-width:560px){ .glance-grid{grid-template-columns:1fr} }
@media (min-width:900px){ .glance-grid{grid-template-columns:repeat(4,1fr)} }
.catalog-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;
  display:flex;flex-direction:column;gap:6px;
}
.catalog-emoji{font-size:1.5rem;line-height:1}
.catalog-card h3{font-size:1rem}
.catalog-card p{color:var(--text-dim);font-size:.88rem;flex:1}
.catalog-link{
  margin-top:8px;display:inline-flex;align-items:center;gap:6px;color:var(--purple);font-weight:700;font-size:.85rem;
  text-decoration:none;
}
.catalog-link svg{width:14px;height:14px}
.catalog-link:hover{text-decoration:underline}
.catalog-link-disabled{color:var(--text-dim);font-style:italic;font-weight:600}

/* ---------- Support: people contact cards ---------- */
.contact-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;
  display:flex;gap:14px;align-items:flex-start;
}
.contact-avatar{
  width:42px;height:42px;border-radius:50%;background:var(--lavender);display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.contact-avatar svg{width:19px;height:19px;color:var(--purple)}
.contact-body h4{font-size:.98rem;margin-bottom:2px}
.contact-title{color:var(--text-dim);font-size:.84rem;margin-bottom:10px}
.tag-your-region{display:inline-block;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.02em;color:var(--purple);background:var(--lavender);border-radius:999px;padding:2px 8px;vertical-align:middle;margin-left:6px}

/* ---------- Related topics ---------- */
.related-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);font-weight:700;margin:22px 0 8px}
.related-links{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.related-link{
  background:var(--lavender);border-radius:10px;padding:11px 14px;text-align:center;font-weight:700;color:var(--purple);
  text-decoration:none;font-size:.87rem;display:flex;align-items:center;justify-content:center;gap:8px;
}
.related-link svg{width:15px;height:15px;flex-shrink:0}
.related-link:hover{background:var(--lavender-deep)}

/* ---------- Copy link (lives in the view toolbar, next to the breadcrumb) ---------- */
.copy-link-btn{
  display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--border);color:var(--text-dim);
  padding:6px 11px;border-radius:8px;font-size:.78rem;font-weight:700;flex-shrink:0;
}
.copy-link-btn svg{width:13px;height:13px}
.copy-link-btn:hover{border-color:var(--purple);color:var(--purple)}
@media (max-width:480px){ .copy-link-btn span{display:none} }

/* ---------- Toast ---------- */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;
  padding:12px 20px;border-radius:10px;font-weight:700;font-size:.88rem;box-shadow:var(--shadow-lg);opacity:0;
  transition:opacity var(--transition),transform var(--transition);z-index:600;pointer-events:none;display:flex;align-items:center;gap:8px;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:15px;height:15px;color:#8CE0AE}

/* ---------- Back to top ---------- */
.back-top{
  position:fixed;bottom:26px;right:26px;width:46px;height:46px;border-radius:50%;background:var(--purple);color:#fff;
  border:0;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow-lg);z-index:150;
}
.back-top.show{display:flex}
.back-top svg{width:19px;height:19px}

/* ---------- Planner ---------- */
.planner-input{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:0;border:2px solid var(--border);border-radius:12px;overflow:hidden}
.stepper button{width:42px;height:42px;background:var(--lavender);border:0;font-size:1.2rem;font-weight:800;color:var(--purple)}
.stepper input{width:64px;text-align:center;border:0;font-weight:800;font-size:1.05rem;height:42px}
.planner-result{margin-top:6px}
.checklist{margin-top:16px}
.check-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.check-item:first-child{border-top:0}
.check-item input{width:19px;height:19px;margin-top:2px;accent-color:var(--purple)}
.check-item label{font-size:.92rem;cursor:pointer}
.check-item.checked label{color:var(--text-dim);text-decoration:line-through}

/* ---------- Scorecards — compact, context-aware summary rows. Deliberately
   flatter than .card-soft/.policy-card: one row per fact, no extra nested
   card inside a card, used only once entitlement is actually confirmed for
   the visitor's chosen context. ---------- */
.scorecard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;margin-bottom:16px}
.scorecard-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mauve);font-weight:800;margin-bottom:8px}
.scorecard-row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:8px 0;border-top:1px solid var(--border);font-size:.92rem}
.scorecard-row:first-child{border-top:0}
.scorecard-row dt{margin:0;color:var(--text-dim);font-weight:600;flex-shrink:0}
.scorecard-row dd{margin:0;color:var(--navy);font-weight:700;text-align:right}

/* ---------- Empty / error states ---------- */
.empty-state{padding:20px;text-align:center;color:var(--text-dim);background:var(--lavender);border-radius:var(--radius)}

/* ---------- Footer ---------- */
footer.site-footer{background:var(--navy);color:rgba(255,255,255,.7);padding:44px 0 30px}
footer.site-footer .wrap{display:flex;flex-direction:column;gap:16px}
footer .foot-brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800}
footer .foot-brand svg{width:110px;height:auto;color:#fff}
footer .foot-meta{font-size:.84rem;line-height:1.7}
footer .foot-note{font-size:.78rem;color:rgba(255,255,255,.45);margin-top:6px}
footer a{color:rgba(255,255,255,.85)}
/* .btn-outline defaults to navy text/border, which is invisible against this
   footer's own navy background — override both for legibility here only. */
footer .btn-outline{color:#fff;border-color:rgba(255,255,255,.3)}
footer .btn-outline:hover{border-color:#fff;color:#fff;background:rgba(255,255,255,.08)}

/* ---------- Utility ---------- */
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------- Print — reveal the whole handbook regardless of which view
   was active on screen; hide anything interactive/app-only ---------- */
@media print{
  .topbar,.sidebar,.drawer,.drawer-overlay,.search-results,.back-top,.feedback-line,
  .btn-row,.toast,.tabs,.view-toolbar,.print-hide,.browse-row,.context-bar,.context-summary{display:none !important}
  body{background:#fff;color:#000}
  .view{display:block !important;animation:none !important}
  .section{border-bottom:1px solid #ccc;padding:18px 0;break-inside:avoid}
  .accordion-panel{max-height:none !important}
  .accordion-trigger .chev{display:none}
  /* Contact details are reference info, not a workflow control — keep them
     legible on a printed copy even though most other .btn-row content
     (navigation buttons, the TR support CTA) is intentionally hidden above. */
  .contact-card .btn-row{display:flex !important}
  a{color:#000;text-decoration:none}
  .app-shell{display:block;padding:0}
  .content{padding:0;max-width:none}
  .wrap{max-width:100%;padding:0 8px}
  table.htable{min-width:0}
  .print-tab-heading{margin:22px 0 10px;font-size:1.05rem;color:#000;border-top:2px solid #000;padding-top:14px}
  .print-tab-block:first-child .print-tab-heading{border-top:0;padding-top:0}
  .print-footer{display:block !important;margin-top:20px;padding-top:12px;border-top:2px solid #000;font-size:.8rem}
}
footer.site-footer .print-footer{display:none}

@media (max-width:640px){
  .wrap{padding:0 16px}
  .view-toolbar{padding-left:16px;padding-right:16px}
  .policy-row{gap:2px}
  .stat-row{grid-template-columns:1fr 1fr}
  .stat-row .stat:last-child{grid-column:1 / -1}
  .home-actions-section{padding-top:40px}
}
</style>

<!-- ==========================================
     MAINTENANCE NOTES (not shown to employees)
     1. Policy data:        data.py -> HANDBOOK_DATA (source), embedded below as JSON
     2. Resource links:     data.py -> RESOURCE_LINKS ("MOONTECH RESOURCE LINKS" block in the script) —
                              this is the ONLY link object shipped in this file. Leaders Toolkit URLs
                              live in data.py's LEADER_TOOLKIT_LINKS_DEV_ONLY dict, which build.py never
                              reads, so none of them are embedded here.
     2b. Contacts/catalog:  data.py -> PEOPLE_CONTACTS / SUPPORT_CATALOG / SELF_SERVICE_ROUTES — feed
                              the Support view and the search index's self-service synonyms.

function $(sel, ctx){ return (ctx || document).querySelector(sel); }
function $all(sel, ctx){ return Array.from((ctx || document).querySelectorAll(sel)); }
function esc(s){
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function h(strings, ...vals){
  // tagged template that auto-escapes interpolated values unless wrapped in raw()
  let out = strings[0];
  for (let i = 0; i < vals.length; i++){
    const v = vals[i];
    out += (v && v.__raw !== undefined) ? v.__raw : esc(v);
    out += strings[i+1];
  }
  return out;
}
function raw(s){ return { __raw: s }; }
function slugify(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
function prefersReducedMotion(){
  try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){ return false; }
}

/* ==========================================
   VIEW ROUTER
   One primary handbook view is visible at a time. All views live in the DOM
   at all times (pre-rendered by the render*() calls in init()) so print and
   search indexing still see everything — CSS (.view / .view.active) is what
   hides the inactive ones. Deep-linked sub-anchors (e.g. #annual-leave,
   #remoteconnect) resolve to their owning view via ANCHOR_VIEW, then are
   scrolled/focused within that view once it's visible.
   ========================================== */
const VIEWS = ['home','welcome','entities','locations','communication','hybrid-work',
  'policy-finder','time-off','code-of-conduct','disciplinary-process','separation','support','directory'];

const ANCHOR_VIEW = {

  'leave-compassionate':'time-off', 'leave-hajj':'time-off', 'leave-study':'time-off',

};

  home:'MoonTech × ITCAN People Guide', welcome:'Our Story', entities:'MoonTech & ITCAN',
  locations:'Where We Work', communication:'Communication', 'hybrid-work':'Working Arrangements',
  'policy-finder':'What Applies to Me?', 'time-off':'Time Off', 'code-of-conduct':'Code of Conduct',
  'disciplinary-process':'Disciplinary Process', separation:'Leaving MoonTech', support:'Support',
  directory:'Guide Directory',
};
const VIEW_PART = {
  welcome:'Who We Are', entities:'Who We Are', locations:'Who We Are',
  communication:'How We Work', 'hybrid-work':'How We Work',
  'policy-finder':'People Policies', 'time-off':'People Policies', 'code-of-conduct':'People Policies',
  'disciplinary-process':'People Policies', separation:'People Policies',
  support:'Support', directory:'Browse',
};

let currentView = null;
function showView(viewId, opts){
  opts = opts || {};
  if (VIEWS.indexOf(viewId) === -1) viewId = 'home';
  const changed = currentView !== viewId;
  currentView = viewId;
  $all('.view').forEach(v => v.classList.toggle('active', v.dataset.view === viewId));
  document.title = viewId === 'home' ? VIEW_TITLES.home : (VIEW_TITLES[viewId] + ' · MoonTech People Guide');
  $all('[data-nav-link]').forEach(l => l.toggleAttribute('aria-current', l.dataset.navLink === viewId));
  if (changed){ window.scrollTo(0, 0); }
  if (opts.focusHeading !== false){
    const heading = document.querySelector('#view-' + viewId + ' h1, #view-' + viewId + ' h2');
    if (heading){
      if (!heading.hasAttribute('tabindex')) heading.setAttribute('tabindex', '-1');
      heading.focus({ preventScroll: true });
    }
  }
}
function resolveAndShow(rawHash, opts){
  const id = (rawHash || '').replace('#', '') || 'home';
  const viewId = ANCHOR_VIEW[id] || 'home';
  ensureAnchorTabVisible(id);
  showView(viewId, opts);
  if (id !== viewId){
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const target = document.getElementById(id);
      if (!target) return;
      target.scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth', block: 'start' });
      target.classList.add('search-flash');
      setTimeout(() => target.classList.remove('search-flash'), 2300);
    }));
  }
}
function initRouter(){
  window.addEventListener('hashchange', () => resolveAndShow(window.location.hash));
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href^="#"]');
    if (!a) return;
    const href = a.getAttribute('href');
    if (!href || href === '#') return;
    if (window.location.hash === href){
      e.preventDefault();
      resolveAndShow(href);
    }
  });
  resolveAndShow(window.location.hash || '#home', { focusHeading: false });
}
function breadcrumbHtml(viewId){
  const title = VIEW_TITLES[viewId] || '';
  const part = VIEW_PART[viewId];
  const showPart = part && part !== title;
  return h`<nav class="breadcrumb" aria-label="Breadcrumb">
    <a href="#home">Home</a>
    ${raw(showPart ? '<span class="crumb-sep">/</span><span class="crumb">' + esc(part) + '</span>' : '')}
    <span class="crumb-sep">/</span><span class="crumb current">${title}</span>
  </nav>`;
}
function toolbarCopyLinkHtml(viewId){
  return h`<button class="copy-link-btn print-hide" data-copy-anchor="${viewId}" type="button" aria-label="Copy link to this page">${raw(icon('copy'))}<span>Copy link</span></button>`;
}
function buildViewToolbars(){
  $all('.view[data-toolbar], [data-toolbar]').forEach(host => {
    const view = host.closest('.view');
    if (!view) return;
    const vid = view.dataset.view;
    if (vid === 'home') return;
    host.innerHTML = breadcrumbHtml(vid) + toolbarCopyLinkHtml(vid);
  });
}

const appContext = { location: null, category: null };
const CONTEXT_BAR_HOSTS = [];
const CONTEXT_LISTENERS = [];
// Hosts the visitor has explicitly asked to re-open via "Change", even
// though location + worker type are both already set. Cleared again once
// both fields are re-confirmed for that host.
const CONTEXT_EDITING = new Set();
function onContextChange(fn){ CONTEXT_LISTENERS.push(fn); }
function broadcastContextChange(){
  CONTEXT_BAR_HOSTS.forEach(renderContextBarInto);
  CONTEXT_LISTENERS.forEach(fn => fn());
}
function registerContextBar(hostSel, onChangeAlsoCall){
  CONTEXT_BAR_HOSTS.push(hostSel);

function locName(k){ const m = HANDBOOK_DATA.locations.items.find(l => l.key === k); return m ? m.name : k; }
function catLabel(k){ const m = WORKER_CATEGORIES.find(c => c.key === k); return m ? m.label : k; }

  const host = $(hostSel);

    </div>`;
    $('#ctx-change-' + key).addEventListener('click', () => { CONTEXT_EDITING.add(hostSel); renderContextBarInto(hostSel); });
    return;
  }

  const cats = appContext.location === 'remote'
    ? WORKER_CATEGORIES.filter(c => c.key !== 'locationBased')
    : WORKER_CATEGORIES;
  host.innerHTML = h`<div class="context-bar">

        <option value="">Choose…</option>
        ${raw(HANDBOOK_DATA.locations.items.map(l => `<option value="${esc(l.key)}" ${appContext.location===l.key?'selected':''}>${esc(l.name)}</option>`).join(''))}
      </select>

      <span>Worker type</span>
      <select id="ctx-category-${key}" ${appContext.location?'':'disabled'}>
        <option value="">Choose…</option>
        ${raw(cats.map(c => `<option value="${esc(c.key)}" ${appContext.category===c.key?'selected':''}>${esc(c.label)}</option>`).join(''))}
      </select>
    </label>
    ${raw(appContext.location ? h`<button class="btn btn-ghost btn-sm" type="button" id="ctx-clear-${raw(key)}">Clear</button>` : '')}
  </div>`;
  $('#ctx-location-' + key).addEventListener('change', (e) => {

  $('#ctx-category-' + key).addEventListener('change', (e) => {
    appContext.category = e.target.value || null;
    if (appContext.location && appContext.category) CONTEXT_EDITING.delete(hostSel);
    broadcastContextChange();
  });
  const clearBtn = $('#ctx-clear-' + key);
  if (clearBtn) clearBtn.addEventListener('click', () => { appContext.location = null; appContext.category = null; CONTEXT_EDITING.delete(hostSel); broadcastContextChange(); });
}

// A payroll, bank-detail, or concern/harassment/sensitive-issue query has one
// deterministic destination, so search surfaces it directly as a real link
// (Slack DM or TR Support) rather than only pointing to a section the
// visitor still has to read through. Routes by the visitor's already-known
// policy location — never a generic email default. Returns null when no
// override applies, or when a payroll/concern query needs a location we
// don't have yet (falls through to the normal indexed Support result).
function searchIntentOverride(q){
  const bankTerms = ['bank', 'iban', 'bank account', 'bank details', 'change bank'];
  const payrollTerms = ['payroll', 'salary', 'salaries', 'payment', 'payslip', 'pay slip', 'pay concern', 'paycheck'];
  const concernTerms = ['concern', 'harassment', 'discrimination', 'sensitive issue', 'sensitive'];
  const hasTerm = (list) => list.some(t => q.includes(t));
  if (hasTerm(bankTerms)){
    const url = RESOURCE_LINKS.trSupportWorkflow || RESOURCE_LINKS.supportTRChannel;
    return { title: 'Open TR Support', section: 'Support', external: true, url: url,
      excerpt: 'Submit bank-detail changes through TR Support before the 20th of the month.' };
  }
  const isPayroll = hasTerm(payrollTerms), isConcern = hasTerm(concernTerms);
  if (isPayroll || isConcern){
    const contact = trContactForLoc(appContext.location);
    if (contact){
      const reason = isPayroll ? 'payroll and payment questions' : 'a concern, harassment, discrimination or other sensitive issue';
      return { title: 'Message ' + contact.name.split(' ')[0] + ' on Slack', section: 'Support', external: true, url: RESOURCE_LINKS[contact.slackKey],
        excerpt: contact.title + ' for ' + contact.regionLabel + '. Direct Slack contact for ' + reason + '.' };
    }
  }
  return null;
}
function runSearch(q){
  q = q.trim().toLowerCase();
  if (!q) return [];
  const terms = q.split(/\s+/).filter(Boolean);
  const scored = SEARCH_INDEX.map(item => {
    let score = 0;
    terms.forEach(term => {
      if (item.title.toLowerCase().includes(term)) score += 5;
      if (item.text.includes(term)) score += 1;
    });
    return { item, score };
  }).filter(x => x.score > 0);
  // when a location context is set, rank matching-location results first
  if (appContext.location){
    const locLabel = locName(appContext.location).toLowerCase();
    scored.forEach(x => { if (x.item.text.includes(locLabel)) x.score += 2; });
  }
  scored.sort((a,b) => b.score - a.score);
  let results = scored.slice(0, 12).map(x => x.item);
  const override = searchIntentOverride(q);
  if (override) results = [override].concat(results).slice(0, 12);
  return results;
}

/* Shared controller factory — powers BOTH the hero search on Home and the
   compact header search used everywhere else. Same index, same scoring,
   same keyboard/ARIA behaviour; only the host input/panel differ. */
function createSearchController(input, panel, opts){
  opts = opts || {};
  let activeIndex = -1;

  function open(){ panel.classList.add('open'); input.setAttribute('aria-expanded', 'true'); }
  function close(){
    panel.classList.remove('open'); input.setAttribute('aria-expanded', 'false');
    activeIndex = -1; input.removeAttribute('aria-activedescendant');
  }
  function toggleClear(show){ if (opts.clearBtn) opts.clearBtn.hidden = !show; }

  function renderResults(q){
    const results = runSearch(q);
    activeIndex = -1;
    input.removeAttribute('aria-activedescendant');
    if (!q){ panel.innerHTML = ''; close(); toggleClear(false); return; }
    toggleClear(true);
    if (!results.length){
      panel.innerHTML = h`<div class="search-empty">No results found. Try another term or <a href="#support" data-search-nav="#support">open Support</a>.</div>`;
    } else {
      panel.innerHTML = results.map((r,i) => r.external
        ? h`<a class="search-result search-result-external" id="${panel.id}-opt-${i}" role="option" aria-selected="false" href="${raw(esc(r.url))}" target="_blank" rel="noopener">
            <div class="sr-section">${r.section}</div><div class="sr-title">${r.title} &rarr;</div>
            <div class="sr-excerpt">${(r.excerpt||'').slice(0,120)}${(r.excerpt||'').length>120?'…':''}</div>
          </a>`
        : h`<a class="search-result" id="${panel.id}-opt-${i}" role="option" aria-selected="false" href="${r.anchor}" data-search-nav="${r.anchor}">
            <div class="sr-section">${r.section}</div><div class="sr-title">${r.title}</div>
            <div class="sr-excerpt">${(r.excerpt||'').slice(0,120)}${(r.excerpt||'').length>120?'…':''}</div>
          </a>`).join('');
    }
    open();
  }
  function setActive(i){
    const optEls = $all('[role="option"]', panel);
    if (!optEls.length) return;
    activeIndex = ((i % optEls.length) + optEls.length) % optEls.length;
    optEls.forEach((o,idx) => o.setAttribute('aria-selected', String(idx===activeIndex)));
    optEls[activeIndex].scrollIntoView({ block: 'nearest' });
    input.setAttribute('aria-activedescendant', optEls[activeIndex].id);
  }
  function go(anchor){
    close(); input.value = ''; toggleClear(false);
    if (window.location.hash === anchor) resolveAndShow(anchor);
    else window.location.hash = anchor;
    if (opts.afterNavigate) opts.afterNavigate();
  }

  input.addEventListener('input', () => renderResults(input.value));
  input.addEventListener('focus', () => { if (input.value) renderResults(input.value); });
  input.addEventListener('keydown', (e) => {
    const optEls = $all('[role="option"]', panel);
    if (e.key === 'ArrowDown'){ if (optEls.length){ e.preventDefault(); setActive(activeIndex+1); } }
    else if (e.key === 'ArrowUp'){ if (optEls.length){ e.preventDefault(); setActive(activeIndex-1); } }
    else if (e.key === 'Enter'){
      if (activeIndex >= 0 && optEls[activeIndex]){
        const el = optEls[activeIndex];
        if (el.dataset.searchNav){ e.preventDefault(); go(el.dataset.searchNav); }
        else { close(); input.value = ''; toggleClear(false); el.click(); }
      }
    } else if (e.key === 'Escape'){ close(); }
  });
  panel.addEventListener('click', (e) => {
    const navA = e.target.closest('[data-search-nav]');
    if (navA){ e.preventDefault(); go(navA.getAttribute('data-search-nav')); return; }
    if (e.target.closest('.search-result-external')){ close(); input.value = ''; toggleClear(false); }
  });
  document.addEventListener('click', (e) => {
    if (!panel.contains(e.target) && e.target !== input) close();
  });
  if (opts.clearBtn){
    opts.clearBtn.addEventListener('click', () => { input.value = ''; close(); toggleClear(false); input.focus(); });
  }
  return { focus: () => input.focus(), close };
}

// two can never drift apart. A Full-Time Remote Contractor gets the same
// answer regardless of which location they happen to live in; a location's
// office/home split is used ONLY for a location-based employee.
function workingArrangementResult(loc, cat){
  const hw = HANDBOOK_DATA.hybridWork;
  if (cat === 'ftRemote') return hw.ftRemoteResult;
  if (cat === 'remoteFreelancer') return hw.remoteFreelancerResult;
  if (cat === 'other') return hw.otherResult;
  if (cat === 'locationBased'){
    const row = hw.pattern.find(p => p.key === loc);
    return row ? row.text : null;
  }
  return null;
}

// arrangement from their location + worker category, we don't re-ask "which
// one applies to me?" or lead with the RemoteConnect wizard as though they
// still need to self-classify — that's the duplicated-question problem this
// page used to have. A Full-Time Remote Contractor or Remote Freelancer
// gets a short secondary note instead of the full comparison grid, since
// RemoteConnect and the office/home pattern genuinely don't apply the same
// way to those categories. Location-based employees keep the full detail.
function renderHybridResult(){
  const hw = HANDBOOK_DATA.hybridWork;
  const loc = appContext.location, cat = appContext.category;
  const resultHost = $('#hybrid-result');
  const ramadanHost = $('#hybrid-ramadan');
  const faqHost = $('#hybrid-faq-host');
  if (resultHost){
    const text = (loc && cat) ? workingArrangementResult(loc, cat) : null;

      ? h`<div class="scorecard"><div class="scorecard-title">${hw.resultLabel}</div>

      : h`<div class="empty-state">Choose your location and worker type above to see your working arrangement here.</div>`;

    const applicable = cat === 'locationBased' && ['dubai','cairo','dammam'].includes(loc);
    ramadanHost.innerHTML = applicable
      ? h`<div class="info-box"><h4>Ramadan working pattern</h4><ul>${raw(hw.ramadan.map(r=>`<li>${esc(r)}</li>`).join(''))}</ul></div>`
      : '';

function renderMyEntitlementTab(){
  const t = HANDBOOK_DATA.timeOff;
  const loc = appContext.location, cat = appContext.category;
  if (!loc || !cat){
    return h`<div class="empty-state">Choose your location and worker type above to see your entitlement here, or use <a href="#policy-finder">What Applies to Me?</a> for a step-by-step answer.</div>`;
  }
  let body = '';
  if (cat === 'locationBased' && ['cairo','dubai','bangalore','dammam'].includes(loc)){
    const phRowMap = { dubai:'Dubai & Cairo employees', cairo:'Dubai & Cairo employees', bangalore:'Bangalore employees', dammam:'Dammam employees' };
    const phRow = t.publicHolidayTable.find(r => r.category === phRowMap[loc]);
    body = t.guidance.map(g => {
      const inner = h`<dl><div class="policy-row" style="border:0;padding:4px 0"><dt>Entitlement</dt><dd>${t.locationTable[g.key][loc]}</dd></div>
      <div class="policy-row"><dt>How to request</dt><dd>${g.howToRequest}</dd></div>
      <div class="policy-row"><dt>Approval</dt><dd>${g.approval}</dd></div>
      <div class="policy-row"><dt>Conditions</dt><dd>${g.conditions}</dd></div></dl>`;
      return accordionItem('ent-' + loc + '-' + g.key, g.title, inner);

      ? r.summary

    body += h`<div style="margin-top:14px">${raw(accordionItem('ent-' + cat + '-ph', 'Public Holidays', h`<p>${entry.note}</p>`))}</div>`;
  } else {
    body = h`<div class="empty-state">${NOT_SPECIFIED}</div>`;
  }
  // Pink Day eligibility is decided in exactly one place: LEAVE_ELIGIBILITY_MATRIX.
  // It must never render as if it automatically applies to a category the
  // matrix doesn't list as eligible.
  const pinkEntry = LEAVE_ELIGIBILITY_MATRIX.pinkDay[cat];

const plannerState = { days: 3, showChecklist: false, checks: {} };
// Single source: the same 7-step process shown in How to Apply.
const PLANNER_CHECKLIST = HANDBOOK_DATA.timeOff.howToApply.checklist;
function plannerAdvanceText(days){
  if (days >= 2 && days <= 5) return 'Apply at least 1 calendar week in advance.';
  if (days >= 6 && days <= 10) return 'Apply at least 20 calendar days in advance.';
  return 'Advance notice for this duration is not specified in this handbook. Please confirm with Talent Relations.';
}
function renderPlanMyLeaveTab(){
  return h`<div>
    <p style="font-weight:700;margin-bottom:10px">Planning leave? How many working days?</p>
    <div class="planner-input">
      <div class="stepper">
        <button type="button" id="planner-minus" aria-label="Decrease days">&minus;</button>
        <input type="number" id="planner-days" value="${plannerState.days}" min="1" max="30" aria-label="Number of working days">
        <button type="button" id="planner-plus" aria-label="Increase days">+</button>
      </div>
      <span style="color:var(--text-dim);font-size:.88rem">working days</span>
    </div>
    <div class="planner-result" id="planner-result">${raw(`<div class="highlight-box">${esc(plannerAdvanceText(plannerState.days))}</div>`)}</div>
    <p style="margin-top:16px"><button class="btn btn-outline btn-sm" type="button" id="planner-checklist-toggle">${plannerState.showChecklist ? 'Hide checklist' : 'View checklist'}</button></p>
    <div id="planner-checklist-wrap" style="${plannerState.showChecklist ? '' : 'display:none'}">
      <h4 style="font-size:.95rem;margin:6px 0 4px">Annual leave checklist</h4>
      <div class="checklist" id="planner-checklist"></div>
      <div class="btn-row"><button class="btn btn-outline btn-sm" id="planner-clear" type="button">Reset checklist</button></div>
    </div>
  </div>`;
}
function wirePlanner(){
  const minus = $('#planner-minus'), plus = $('#planner-plus'), input = $('#planner-days');
  if (minus) minus.addEventListener('click', () => { plannerState.days = Math.max(1, plannerState.days - 1); input.value = plannerState.days; renderPlannerResult(); });
  if (plus) plus.addEventListener('click', () => { plannerState.days = Math.min(30, plannerState.days + 1); input.value = plannerState.days; renderPlannerResult(); });
  if (input) input.addEventListener('input', (e) => { let v = parseInt(e.target.value, 10); if (isNaN(v)) v = 1; plannerState.days = Math.min(30, Math.max(1, v)); renderPlannerResult(); });
  const toggle = $('#planner-checklist-toggle');
  if (toggle) toggle.addEventListener('click', () => {
    plannerState.showChecklist = !plannerState.showChecklist;
    const wrap = $('#planner-checklist-wrap');
    wrap.style.display = plannerState.showChecklist ? '' : 'none';
    toggle.textContent = plannerState.showChecklist ? 'Hide checklist' : 'View checklist';
    if (plannerState.showChecklist) renderPlannerChecklist();
  });
  if (plannerState.showChecklist) renderPlannerChecklist();
}
function renderPlannerResult(){
  const el = $('#planner-result');
  if (el) el.innerHTML = h`<div class="highlight-box">${plannerAdvanceText(plannerState.days)}</div>`;
}
function renderPlannerChecklist(){
  const el = $('#planner-checklist');
  if (!el) return;
  el.innerHTML = PLANNER_CHECKLIST.map((item, i) => h`<div class="check-item ${plannerState.checks[i] ? 'checked' : ''}">
    <input type="checkbox" id="chk-${i}" ${plannerState.checks[i] ? 'checked' : ''}>
    <label for="chk-${i}">${item}</label>
  </div>`).join('');
  PLANNER_CHECKLIST.forEach((_, i) => {
    $('#chk-' + i).addEventListener('change', (e) => { plannerState.checks[i] = e.target.checked; renderPlannerChecklist(); });
  });
  const clear = $('#planner-clear');
  if (clear) clear.addEventListener('click', () => { plannerState.checks = {}; renderPlannerChecklist(); });
}

/* ==========================================
   POLICY FINDER — "What applies to me?"
   The one personalised-policy route. Its location/category questions are
   the same shared context used across the site, so answering them once
   here (or anywhere else the context bar appears) carries through.
   ========================================== */
const finderState = { step: 1, topic: null };
const FINDER_TOPICS = [
  { key:'annual', label:'Annual Leave' }, { key:'sick', label:'Sick Leave' },
  { key:'maternity', label:'Maternity Leave' }, { key:'paternity', label:'Paternity Leave' },
  { key:'compassionate', label:'Compassionate Leave' }, { key:'hajj', label:'Hajj Leave' },
  { key:'study', label:'Study / Exam Leave' }, { key:'pinkDay', label:'Pink Day Leave' },
  { key:'publicHolidays', label:'Public Holidays' },
  { key:'wfh', label:'Work From Home' }, { key:'remoteConnect', label:'RemoteConnect' },
  { key:'workingHours', label:'Working Hours' }, { key:'separation', label:'Separation / Notice' },
];
const LEAVE_MATRIX_TOPICS = ['annual','sick','maternity','paternity','compassionate','hajj','study','publicHolidays','pinkDay'];
// Who to route a Policy Finder card to, by the visitor's location — never a
// generic email default. Fiola covers Dubai & Remote, Nivin covers Cairo,
// Dammam & Bangalore (same regional split as Support).
function trContactForLoc(loc){
  return PEOPLE_CONTACTS.find(c => c.regions.includes(loc)) || null;
}

// A destination is plain data — never a pre-rendered HTML string. Earlier,
// whereToGo held an already-built `<a href=...>` fragment produced by one
// h`` template, then that fragment got interpolated into a SECOND h``
// template (`h\`Apply on ${plummLink}.\``) without raw() — so the outer
// template auto-escaped it, then the single renderer at the bottom of
// renderFinder() wrapped the (now-escaped) string in raw() again, printing
// the literal "<a href=...>Plumm</a>" markup as visible text. Structured
// data has no markup to accidentally escape or double-render — only
// renderDestination() (defined once, below) ever turns it into an <a>.
function destination(type, label, url){ return { type, label, url }; }
function renderDestination(d){
  if (!d || !d.url) return '';
  return h`<a class="dest-link" href="${raw(esc(d.url))}" target="_blank" rel="noopener">${d.label} →</a>`;
}
function resolveFinderCard(){
  const t = HANDBOOK_DATA.timeOff;
  const loc = appContext.location, cat = appContext.category, topic = finderState.topic;
  const appliesTo = locName(loc) + ' · ' + catLabel(cat);
  // whereToGo is structured destination data (see destination() above) or
  // null. A null whereToGo means the "Where to go" row is omitted entirely —
  // never rendered as an empty placeholder.
  const base = { appliesTo, entitlement: NOT_SPECIFIED, process: '', approval: '',
    conditions: '', whereToGo: null, source: '#time-off', sourceLabel: 'Time Off' };
  const guidance = t.guidance.find(g => g.key === topic);
  const locKeyValid = ['dubai','cairo','bangalore','dammam'].includes(loc);
  const phRowMap = { dubai:'Dubai & Cairo employees', cairo:'Dubai & Cairo employees', bangalore:'Bangalore employees', dammam:'Dammam employees' };
  const contact = trContactForLoc(loc);
  const contactDest = contact ? destination('slack', 'Message ' + contact.name.split(' ')[0] + ' on Slack', RESOURCE_LINKS[contact.slackKey]) : null;
  const plummDest = destination('external', 'Apply in Plumm', RESOURCE_LINKS.plummEmployeeGuide);
  const trSupportUrl = RESOURCE_LINKS.trSupportWorkflow || RESOURCE_LINKS.supportTRChannel;
  const trSupportDest = destination('support', 'Open TR Support', trSupportUrl);

  // ---- everything the eligibility matrix covers: 7 leave types, public holidays, pink day ----
  if (LEAVE_MATRIX_TOPICS.includes(topic)){
    const isLeaveType = guidance != null;
    base.source = topic === 'publicHolidays' ? '#public-holidays' : (topic === 'pinkDay' ? '#time-off' : (guidance.key === 'annual' ? '#annual-leave' : ('#leave-' + guidance.key)));
    base.sourceLabel = topic === 'publicHolidays' ? 'Time Off › Public Holidays' : (topic === 'pinkDay' ? 'Time Off › My Entitlement' : ('Time Off › ' + guidance.title));

    if (cat === 'locationBased'){
      if (topic === 'publicHolidays'){
        const row = locKeyValid ? t.publicHolidayTable.find(r => r.category === phRowMap[loc]) : null;
        if (row){
          base.entitlement = row.entitlement;
          base.conditions = 'Deducted from leave: ' + row.deducted + '. Extends leave: ' + row.extends + '.';
          base.process = 'No leave request is required for public holidays.';
        }
      } else if (topic === 'pinkDay'){
        base.entitlement = HANDBOOK_DATA.timeOff.pinkDay.points[0];
        base.conditions = HANDBOOK_DATA.timeOff.pinkDay.points[1];
        base.whereToGo = plummDest;
      } else if (locKeyValid){
        base.entitlement = t.locationTable[topic][loc];
        base.process = guidance.howToRequest; base.approval = guidance.approval; base.conditions = guidance.conditions;
        base.whereToGo = plummDest;
      } else {
        base.conditions = 'Location-based leave entitlements are defined for Cairo, Dubai, Bangalore and Dammam. If you work fully remotely, try the Full-Time Remote Contractor or Remote Freelancer worker category.';
      }
    } else if (['ftRemote','remoteFreelancer','other'].includes(cat)){
      const entry = LEAVE_ELIGIBILITY_MATRIX[topic][cat];
      // Eligible here only ever applies to Full-Time Remote Contractor's
      // annual/sick/compassionate/publicHolidays/pinkDay (Remote Freelancer
      // and Other are never eligible for any leave type). Each topic gets its
      // OWN request process — sick and compassionate must never be told to
      // follow the Annual Leave advance-notice/delegation workflow.
      if (entry && entry.eligible){
        base.entitlement = entry.entitlement;
        if (entry.deducted) base.conditions = 'Deducted from leave: ' + entry.deducted + '. Extends leave: ' + entry.extends + '.';
        else if (entry.notes) base.conditions = entry.notes.join(' ');
        if (topic === 'publicHolidays'){
          base.process = 'No leave request is required for public holidays.';
        } else if (topic === 'pinkDay'){
          base.process = 'Request it in Plumm. Your manager and Talent Relations approve it there.';
          base.whereToGo = plummDest;
        } else if (topic === 'sick'){
          base.process = 'Record or request the absence in Plumm, and inform your manager and Talent Relations. No advance notice is required.';
          base.whereToGo = plummDest;
        } else if (topic === 'compassionate'){
          base.process = 'Inform your manager and Talent Relations promptly, then submit the leave in Plumm. No advance notice is required.';
          base.whereToGo = plummDest;
        } else {
          base.process = 'Follow the standard leave process (see How to Apply).'; base.approval = 'Direct manager, then Talent Relations.'; base.whereToGo = plummDest;
        }
      } else if (entry) {
        // No standard entitlement: the note IS the answer, not a footnote
        // under a generic "Not specified" default (see round 7 no-entitlement
        // fallback fix).
        base.entitlement = entry.note;
      }
    }
  }
  // ---- work from home / working arrangement ----
  // Shares workingArrangementResult() with the Working Arrangements page so
  // the two can never show a different answer for the same context.
  else if (topic === 'wfh'){
    base.source = '#hybrid-work'; base.sourceLabel = 'Working Arrangements';
    base.approval = 'Governed by location, role requirements, manager approval and company policy.';
    base.process = 'Not a leave request. Follow your working arrangement.';
    base.entitlement = workingArrangementResult(loc, cat) || NOT_SPECIFIED;
  }
  // ---- remoteconnect ----
  else if (topic === 'remoteConnect'){
    base.source = '#remoteconnect'; base.sourceLabel = 'RemoteConnect';
    if (cat === 'locationBased' && loc === 'dubai'){
      base.entitlement = 'Available to eligible UAE location-based employees, for up to 15 working days a year, subject to approval and eligibility.';
      base.process = 'Requires advance approval. See the RemoteConnect eligibility and application detail.';
      base.whereToGo = trSupportDest;
    } else {
      base.entitlement = 'Not available by default.';
      base.conditions = 'RemoteConnect does not apply to Cairo, Bangalore, Dammam, Full-Time Remote Contractor or Remote Freelancer, unless separately approved in writing.';
    }
  }
  // ---- working hours ----
  else if (topic === 'workingHours'){
    base.source = '#locations'; base.sourceLabel = 'Our Locations';
    const l = HANDBOOK_DATA.locations.items.find(x => x.key === loc);
    base.entitlement = l ? l.hours : NOT_SPECIFIED;
    if (['remoteFreelancer','other'].includes(cat)) base.conditions = 'Individual circumstances may differ. Confirm with Talent Relations if this isn’t clearly covered.';
  }
  // ---- separation ----
  else if (topic === 'separation'){
    base.source = '#separation'; base.sourceLabel = 'Leaving MoonTech';
    if (cat === 'locationBased' && locKeyValid){
      const row = t2card(loc);
      if (row){
        base.entitlement = row.notice;
        base.conditions = row.nonCompete + (row.caution ? (' ' + row.caution) : '') + '. ' + HANDBOOK_DATA.separation.gratuityNote;
        base.process = 'Email your resignation to your direct manager and CC Talent Relations to start the process.';
      }
    } else if (cat){
      base.entitlement = HANDBOOK_DATA.separation.nonEmployeeResult;
      base.conditions = HANDBOOK_DATA.separation.nonEmployeeFollowUp;
      base.process = 'Email your resignation to your direct manager and CC Talent Relations to start the process.';
    }
    if (contact) base.whereToGo = contactDest;
  }

  // Default "where to go" for anything left unset by a leave-type branch
  // above but that clearly needs a TR conversation (a note was set but no
  // destination) — resolved by region, never a generic email address.
  if (!base.whereToGo && base.conditions && contact && ['maternity','paternity','hajj','study'].includes(topic)){
    base.whereToGo = contactDest;
  }
  return base;
}
function t2card(loc){ return HANDBOOK_DATA.separation.cards.find(c => c.location.toLowerCase() === locName(loc).toLowerCase()); }

function renderFinder(){
  const root = $('#policy-finder-tool');
  if (!root) return;
  const haveContext = !!(appContext.location && appContext.category);
  let body = '';
  if (!haveContext){
    body = h`<div class="empty-state">Set your location and worker type above to continue.</div>`;
  } else if (finderState.step < 3 || !finderState.topic){
    finderState.step = 3;
    body = h`<h3 style="font-size:1.05rem;margin-bottom:12px">What do you want to know?</h3>
      <div class="option-grid">${raw(FINDER_TOPICS.map(t =>
        `<button class="option-btn" data-finder-topic="${t.key}">${esc(t.label)}</button>`).join(''))}</div>`;
  } else {
    const c = resolveFinderCard();
    const todo = [c.process, c.approval ? ('Approval: ' + c.approval) : null].filter(Boolean).join(' ');
    body = h`<div class="policy-card">
      <div class="applies-to">${c.appliesTo}</div>
      <dl>
        <div class="policy-row"><dt>Your policy</dt><dd>${c.entitlement}</dd></div>
        ${raw(todo ? h`<div class="policy-row"><dt>What to do</dt><dd>${todo}</dd></div>` : '')}
        ${raw(c.conditions ? h`<div class="policy-row"><dt>Good to know</dt><dd>${c.conditions}</dd></div>` : '')}
        ${raw(c.whereToGo ? h`<div class="policy-row"><dt>Where to go</dt><dd>${raw(renderDestination(c.whereToGo))}</dd></div>` : '')}
      </dl>
      <p style="margin-top:14px;font-size:.85rem;color:var(--text-dim)">Individual circumstances may differ. If this doesn’t clearly cover your situation, talk to Talent Relations.</p>
      <div class="btn-row">
        <a class="btn btn-primary btn-sm" href="${c.source}">${raw(icon('arrowRight'))} Read full policy</a>
        <button class="btn btn-outline btn-sm" data-finder-reset type="button">Ask about something else</button>
      </div>
    </div>`;
  }

  root.innerHTML = body;

  $all('[data-finder-topic]', root).forEach(b => b.addEventListener('click', () => { finderState.topic = b.dataset.finderTopic; renderFinder(); }));
  const resetBtn = $('[data-finder-reset]', root);
  if (resetBtn) resetBtn.addEventListener('click', () => { finderState.topic = null; renderFinder(); });
}
function renderFinderSection(){
  $('#policy-finder').innerHTML = h`<div class="wrap wrap-wide">
    <div class="section-head"><h2 tabindex="-1">What applies to me?</h2>
    <p class="lede">Set your location and worker type once, pick a topic, and see the exact rule that applies to you.</p></div>
    <div id="policy-finder-context"></div>
    <div id="policy-finder-tool"></div>
  </div>`;
  registerContextBar('#policy-finder-context', () => { finderState.topic = null; renderFinder(); });
  renderFinder();
}

// Slack only — no email button anywhere on a contact card. Email is

// Support never shows a location/worker-type selector of its own (§19: use
