/* ==========================================
   ACCORDION engine (shared)
   ========================================== */
function setAccordion(trigger, open){
  const panel = document.getElementById(trigger.getAttribute('aria-controls'));
  trigger.setAttribute('aria-expanded', String(open));
  if (panel) panel.style.maxHeight = open ? (panel.scrollHeight + 'px') : '0px';
}
function bindAccordions(scope){
  $all('[data-accordion-trigger]', scope).forEach(trigger => {
    if (trigger.dataset.bound) return;
    trigger.dataset.bound = '1';
    trigger.addEventListener('click', () => setAccordion(trigger, trigger.getAttribute('aria-expanded') !== 'true'));
  });
}

/* ==========================================
   NAV / SIDEBAR / MOBILE DRAWER
   ========================================== */
function buildSidebarAndTopnav(){
  const partsOrder = [];
  const byPart = {};
  SECTIONS.forEach(s => {
    if (!s.part) return;
    if (!byPart[s.part]){ byPart[s.part] = []; partsOrder.push(s.part); }
    byPart[s.part].push(s);
  });
  const sideHtml = partsOrder.map(p => h`<div class="side-group">
    <div class="side-label">${p}</div>
    ${raw(byPart[p].map(s => `<a class="side-link" href="#${s.id}" data-nav-link="${s.id}"><span>${esc(s.label)}</span></a>`).join(''))}
  </div>`).join('');
  const topLinks = h`<a class="side-link side-link-top" href="#home" data-nav-link="home">${raw(icon('home'))}<span>Home</span></a>
    <a class="side-link side-link-secondary" href="#directory" data-nav-link="directory">${raw(icon('list'))}<span>Browse all</span></a>`;
  $('#sidebar-nav').innerHTML = topLinks + sideHtml;
  $('#drawer-nav').innerHTML = topLinks + sideHtml;
}
function initMobileDrawer(){
  const overlay = $('#drawer-overlay'), drawer = $('#drawer'), openBtn = $('#menu-toggle'), closeBtn = $('#drawer-close');
  function open(){ overlay.classList.add('open'); drawer.classList.add('open'); openBtn.setAttribute('aria-expanded','true'); }
  function close(){ overlay.classList.remove('open'); drawer.classList.remove('open'); openBtn.setAttribute('aria-expanded','false'); }
  openBtn.addEventListener('click', open);
  closeBtn.addEventListener('click', close);
  overlay.addEventListener('click', close);
  $all('[data-nav-link]', drawer).forEach(l => l.addEventListener('click', close));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
}
function initBackToTop(){
  const btn = $('#back-top');
  window.addEventListener('scroll', () => { btn.classList.toggle('show', window.scrollY > 700); }, { passive: true });
  btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: prefersReducedMotion() ? 'auto' : 'smooth' }));
}

/* ==========================================
   COPY LINK + TOAST
   ========================================== */
function showToast(msg){
  const t = $('#toast');
  t.innerHTML = icon('checkCircle') + '<span>' + esc(msg) + '</span>';
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(() => t.classList.remove('show'), 2400);
}
function initCopyLinks(){
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-copy-anchor]');
    if (!btn) return;
    const anchor = btn.dataset.copyAnchor;
    const url = window.location.href.split('#')[0] + '#' + anchor;
    const done = () => showToast('Link copied');
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done).catch(() => fallbackCopy(url, done));
    } else fallbackCopy(url, done);
  });
}
function fallbackCopy(text, cb){
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    cb();
  } catch(e){}
}

/* ==========================================
   PRINT — the router shows one view at a time on screen, but "Print / Save
   as PDF" must still produce the whole handbook. All .view elements are
   already display:block in print media (see CSS); for Time Off specifically
   we also have to splice in all six tabs (only one is normally rendered at
   a time) before printing, then restore the live tab afterwards.
   ========================================== */
function timeOffTabPrintHtml(tabKey){
  if (tabKey === 'entitlement') return renderMyEntitlementTab();
  if (tabKey === 'types') return renderLeaveTypesTab();
  if (tabKey === 'holidays') return phTableHtml('all');
  if (tabKey === 'apply') return renderHowToApplyTab();
  if (tabKey === 'plan') return renderPlanMyLeaveTab();
  if (tabKey === 'compare') return renderCompareLocationsTab();
  return '';
}
function initPrint(){
  $('#print-btn').addEventListener('click', () => {
    const host = $('#timeoff-tab-body');
    const liveTab = timeOffState.tab;
    const printHtml = TIME_OFF_TABS.map(tb => h`<div class="print-tab-block">
      <h3 class="print-tab-heading">${tb.label}</h3>${raw(timeOffTabPrintHtml(tb.key))}
    </div>`).join('');
    const backup = host.innerHTML;
    host.innerHTML = printHtml;

    $all('.accordion-trigger').forEach(t => setAccordion(t, true));

    let restored = false;
    const restore = () => {
      if (restored) return;
      restored = true;
      host.innerHTML = backup;
      timeOffState.tab = liveTab;
      renderTimeOffTabBody();
      window.removeEventListener('afterprint', restore);
    };
    window.addEventListener('afterprint', restore);
    setTimeout(() => { window.print(); setTimeout(restore, 600); }, 80);
  });
}

/* ==========================================
   KEYBOARD SHORTCUTS
   "/" focuses the hero search on Home, or the header search everywhere else,
   so there is always exactly one obvious place to start typing.
   ========================================== */
function initKeyboard(){
  document.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
    if (e.key === '/' && !typing){
      e.preventDefault();
      if (currentView === 'home'){ const hi = $('#hero-search-input'); if (hi) hi.focus(); }
      else { const si = $('#search-input'); if (si) si.focus(); }
    }
    if (e.key === 'Escape'){
      $all('.search-results.open').forEach(b => b.classList.remove('open'));
    }
  });
}

/* ==========================================
   INIT
   ========================================== */
function init(){
  $all('.logo-slot').forEach(slot => slot.innerHTML = logoMarkup(slot.dataset.logoClass || ''));
  $('#footer-version').textContent = HANDBOOK_VERSION + ' · ' + HANDBOOK_DATE;
  $('#footer-owner').textContent = POLICY_OWNER;
  $all('.print-owner').forEach(x => x.textContent = POLICY_OWNER);

  buildSidebarAndTopnav();
  renderHome();
  renderPartOne();
  renderPartTwo();
  renderPartThree();
  renderFinderSection();
  renderTimeOff();
  renderPolicyPages();
  renderSupport();
  renderDirectory();
  buildViewToolbars();

  buildSearchIndex();
  createSearchController($('#search-input'), $('#search-results'), { clearBtn: $('#search-clear') });
  initMobileDrawer();
  initBackToTop();
  initCopyLinks();
  initPrint();

  initRouter();

    $all('.accordion-trigger[aria-expanded="true"]').forEach(t => setAccordion(t, true));
  });
}
document.addEventListener('DOMContentLoaded', init);
